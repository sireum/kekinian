name: Linux-CompCert

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"

jobs:

  ci-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Clean
        run: |
          rm -fR "$GITHUB_WORKSPACE/Sireum"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: Sireum
          submodules: recursive
      - name: Cache Java
        id: cache-java
        uses: actions/cache@v5
        with:
          path: Sireum/bin/linux/java
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-compcert-java
      - name: Cache Scala
        id: cache-scala
        uses: actions/cache@v5
        with:
          path: Sireum/bin/scala
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-compcert-scala
      - name: Cache Coursier
        id: cache-coursier
        uses: actions/cache@v5
        with:
          path: Sireum/cache/coursier
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-compcert-coursier
      - name: Cache CompCert
        id: cache-compcert
        uses: actions/cache@v5
        with:
          path: |
            Sireum/bin/linux/.compcert.ver
            Sireum/bin/linux/.coq.ver
            Sireum/bin/linux/.menhir.ver
            Sireum/bin/linux/.opam.ver
            Sireum/bin/linux/.opam
            Sireum/bin/linux/opam
          key: ${{ runner.os }}-${{ hashFiles('Sireum/bin/install/opam.cmd','Sireum/bin/install/compcert.cmd') }}-compcert
      - name: Setup APE binfmt
        run: |
          # The APE loader of the Cosmopolitan version Sireum pins, from sireum/rolling's ape
          # release and checked against its SHA256SUMS.  A version with no loader there fails here:
          # upload ape-<arch>-<version>.elf for it (from that version's cosmocc zip).
          COSMOS_VER=$(sed -n 's/^org\.sireum\.version\.cosmos=//p' "$GITHUB_WORKSPACE/Sireum/versions.properties")
          APE="ape-$(uname -m)-${COSMOS_VER}.elf"
          ROLLING=https://github.com/sireum/rolling/releases/download/ape
          curl -fsSL --retry 3 --connect-timeout 20 -o "/tmp/$APE" "$ROLLING/$APE"
          curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/ape.sha256 "$ROLLING/SHA256SUMS"
          (cd /tmp && grep " $APE\$" ape.sha256 | sha256sum -c -)
          sudo install -m 755 "/tmp/$APE" /usr/bin/ape
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true
      - name: Test
        run: |
          export COURSIER_CACHE=$GITHUB_WORKSPACE/Sireum/cache/coursier
          cd $GITHUB_WORKSPACE/Sireum
          .ci/linux-compcert.sh
  ci-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clean
        run: |
          rm -fR "$GITHUB_WORKSPACE/Sireum"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: Sireum
          submodules: recursive
      - name: Cache Java
        id: cache-java
        uses: actions/cache@v5
        with:
          path: Sireum/bin/linux/arm/java
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-compcert-java
      - name: Cache Scala
        id: cache-scala
        uses: actions/cache@v5
        with:
          path: Sireum/bin/scala
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-compcert-scala
      - name: Cache Coursier
        id: cache-coursier
        uses: actions/cache@v5
        with:
          path: Sireum/cache/coursier
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-compcert-coursier
      - name: Cache CompCert
        id: cache-compcert
        uses: actions/cache@v5
        with:
          path: |
            Sireum/bin/linux/arm/.compcert.ver
            Sireum/bin/linux/arm/.coq.ver
            Sireum/bin/linux/arm/.menhir.ver
            Sireum/bin/linux/arm/.opam.ver
            Sireum/bin/linux/arm/.opam
            Sireum/bin/linux/arm/opam
          key: ${{ runner.os }}-${{ hashFiles('Sireum/bin/install/opam.cmd','Sireum/bin/install/compcert.cmd') }}-compcert
      - name: Setup APE binfmt
        run: |
          # The APE loader of the Cosmopolitan version Sireum pins, from sireum/rolling's ape
          # release and checked against its SHA256SUMS.  A version with no loader there fails here:
          # upload ape-<arch>-<version>.elf for it (from that version's cosmocc zip).
          COSMOS_VER=$(sed -n 's/^org\.sireum\.version\.cosmos=//p' "$GITHUB_WORKSPACE/Sireum/versions.properties")
          APE="ape-$(uname -m)-${COSMOS_VER}.elf"
          ROLLING=https://github.com/sireum/rolling/releases/download/ape
          curl -fsSL --retry 3 --connect-timeout 20 -o "/tmp/$APE" "$ROLLING/$APE"
          curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/ape.sha256 "$ROLLING/SHA256SUMS"
          (cd /tmp && grep " $APE\$" ape.sha256 | sha256sum -c -)
          sudo install -m 755 "/tmp/$APE" /usr/bin/ape
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true
      - name: Test
        run: |
          export COURSIER_CACHE=$GITHUB_WORKSPACE/Sireum/cache/coursier
          cd $GITHUB_WORKSPACE/Sireum
          .ci/linux-compcert.sh
