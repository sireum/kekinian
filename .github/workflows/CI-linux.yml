name: Linux

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"

jobs:

  ci-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Clean
        run: |
          rm -fR "$GITHUB_WORKSPACE/Sireum"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: Sireum
          submodules: recursive
      - name: Cache Java
        id: cache-java
        uses: actions/cache@v5
        with:
          path: Sireum/bin/linux/java
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-java
      - name: Cache Scala
        id: cache-scala
        uses: actions/cache@v5
        with:
          path: Sireum/bin/scala
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-scala
      - name: Cache Coursier
        id: cache-coursier
        uses: actions/cache@v5
        with:
          path: Sireum/cache/coursier
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-coursier
      - name: Cache OSATE
        id: cache-osate
        uses: actions/cache@v5
        with:
          path: Sireum/bin/linux/osate
          key: ${{ runner.os }}-${{ hashFiles('Sireum/hamr/codegen/jvm/src/main/resources/phantom_versions.properties') }}-osate
      - name: Setup APE binfmt
        run: |
          # The APE loader of the Cosmopolitan version Sireum pins, from sireum/rolling's ape
          # release and checked against its SHA256SUMS.  A version with no loader there fails here:
          # upload ape-<arch>-<version>.elf for it (from that version's cosmocc zip).
          COSMOS_VER=$(sed -n 's/^org\.sireum\.version\.cosmos=//p' "$GITHUB_WORKSPACE/Sireum/versions.properties")
          APE="ape-$(uname -m)-${COSMOS_VER}.elf"
          ROLLING=https://github.com/sireum/rolling/releases/download/ape
          curl -fsSL --retry 3 --connect-timeout 20 -o "/tmp/$APE" "$ROLLING/$APE"
          curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/ape.sha256 "$ROLLING/SHA256SUMS"
          (cd /tmp && grep " $APE\$" ape.sha256 | sha256sum -c -)
          sudo install -m 755 "/tmp/$APE" /usr/bin/ape
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true
      - name: Test
        run: |
          export COURSIER_CACHE=$GITHUB_WORKSPACE/Sireum/cache/coursier
          cd $GITHUB_WORKSPACE/Sireum
          # stopped, with a dump of every Java thread, after 20 minutes without output
          # rather than at GitHub's six-hour limit -- see .ci/watchdog.sh
          .ci/watchdog.sh 20 bash -c '.ci/build.sh && .ci/build.sh test-verify'
      - name: Cache Graal
        id: cache-graal
        uses: actions/cache@v5
        with:
          path: Sireum/bin/linux/graal
          key: ${{ runner.os }}-${{ hashFiles('Sireum/bin/install/graal.cmd') }}-graal
      - name: Test Native
        run: |
          export MUSL_HOME="$GITHUB_WORKSPACE/musl-toolchain"
          export PATH="$MUSL_HOME/bin:$PATH"
          export COURSIER_CACHE=$GITHUB_WORKSPACE/Sireum/cache/coursier
          cd $GITHUB_WORKSPACE/Sireum
          .ci/linux-native.sh
          rm bin/linux/sireum

  ci-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clean
        run: |
          rm -fR "$GITHUB_WORKSPACE/Sireum"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: Sireum
          submodules: recursive
      - name: Cache Java
        id: cache-java
        uses: actions/cache@v5
        with:
          path: Sireum/bin/linux/arm/java
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-java
      - name: Cache Scala
        id: cache-scala
        uses: actions/cache@v5
        with:
          path: Sireum/bin/scala
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-scala
      - name: Cache Coursier
        id: cache-coursier
        uses: actions/cache@v5
        with:
          path: Sireum/cache/coursier
          key: ${{ runner.os }}-${{ hashFiles('Sireum/versions.properties') }}-coursier
      - name: Cache OSATE
        id: cache-osate
        uses: actions/cache@v5
        with:
          path: Sireum/bin/linux/arm/osate
          key: ${{ runner.os }}-${{ hashFiles('Sireum/hamr/codegen/jvm/src/main/resources/phantom_versions.properties') }}-osate
      - name: Setup APE binfmt
        run: |
          # The APE loader of the Cosmopolitan version Sireum pins, from sireum/rolling's ape
          # release and checked against its SHA256SUMS.  A version with no loader there fails here:
          # upload ape-<arch>-<version>.elf for it (from that version's cosmocc zip).
          COSMOS_VER=$(sed -n 's/^org\.sireum\.version\.cosmos=//p' "$GITHUB_WORKSPACE/Sireum/versions.properties")
          APE="ape-$(uname -m)-${COSMOS_VER}.elf"
          ROLLING=https://github.com/sireum/rolling/releases/download/ape
          curl -fsSL --retry 3 --connect-timeout 20 -o "/tmp/$APE" "$ROLLING/$APE"
          curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/ape.sha256 "$ROLLING/SHA256SUMS"
          (cd /tmp && grep " $APE\$" ape.sha256 | sha256sum -c -)
          sudo install -m 755 "/tmp/$APE" /usr/bin/ape
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true
      - name: Test
        run: |
          export COURSIER_CACHE=$GITHUB_WORKSPACE/Sireum/cache/coursier
          cd $GITHUB_WORKSPACE/Sireum
          # stopped, with a dump of every Java thread, after 20 minutes without output
          # rather than at GitHub's six-hour limit -- see .ci/watchdog.sh
          .ci/watchdog.sh 20 bash -c '.ci/build.sh && .ci/build.sh test-verify'
      - name: Cache Graal
        id: cache-graal
        uses: actions/cache@v5
        with:
          path: Sireum/bin/linux/arm/graal
          key: ${{ runner.os }}-${{ hashFiles('Sireum/bin/install/graal.cmd') }}-graal
